
{% include 'dashboard/cabecalho.html' %}

<h1 class="mb-4">Lista Matrículas</h1>

<a href="/matricula/form" class="btn btn-primary mb-3">Novo</a>

<div class="row">

</div>

<table class="table table-bordered table-striped">

    <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Aluno</th>
            <th>Curso</th>
            <th>Semestre</th>
            <th>Professor</th>
            <th>Disciplina</th>
            <th>Ações</th>
        </tr>
    </thead>

    <tbody>

        {% for item in lista %}

        <tr>
            <td>{{ item[0] }}</td>
            <td>{{ item[1] }}</td>
            <td>{{ item[2] }}</td>
            <td>{{ item[3] }}</td>
            <td>{{ item[4] }}</td>
            <td>{{ item[5] }}</td>

            <td>
                <a href="/matricula/editar/{{ item[0] }}"
                   class="btn btn-primary btn-sm">Editar</a>

                <a href="/matricula/remover/{{ item[0] }}"
                   class="btn btn-danger btn-sm">Remover</a>
            </td>
        </tr>

        {% endfor %}

    </tbody>

</table>

{% include 'dashboard/rodape.html' %}
